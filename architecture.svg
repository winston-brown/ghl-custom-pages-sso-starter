<svg width="700" height="520" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
    </marker>
    <marker id="arr-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="520" fill="#ffffff" rx="8" />

  <!-- GHL Parent CRM -->
  <rect x="210" y="20" width="280" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
  <text x="350" y="50" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">GHL Parent CRM</text>
  <text x="350" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#a16207" text-anchor="middle">iframe host</text>

  <!-- Bidirectional postMessage arrows -->
  <line x1="310" y1="100" x2="310" y2="150" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)" />
  <line x1="390" y1="150" x2="390" y2="100" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)" />
  <text x="270" y="132" font-family="monospace" font-size="9" fill="#1e40af">REQUEST_</text>
  <text x="270" y="143" font-family="monospace" font-size="9" fill="#1e40af">USER_DATA</text>
  <text x="400" y="132" font-family="monospace" font-size="9" fill="#92400e">encrypted</text>
  <text x="400" y="143" font-family="monospace" font-size="9" fill="#92400e">payload</text>

  <!-- Frontend Box -->
  <rect x="140" y="155" width="420" height="130" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <text x="350" y="182" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">Frontend — Vite + React + TypeScript</text>
  <line x1="180" y1="192" x2="520" y2="192" stroke="#bfdbfe" stroke-width="1" />

  <!-- Frontend function boxes -->
  <rect x="160" y="205" width="120" height="32" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" />
  <text x="220" y="226" font-family="monospace" font-size="10" fill="#1e40af" text-anchor="middle">requestSSOKey()</text>

  <rect x="290" y="205" width="130" height="32" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" />
  <text x="355" y="226" font-family="monospace" font-size="10" fill="#1e40af" text-anchor="middle">validateSSOKey()</text>

  <rect x="430" y="205" width="120" height="32" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" />
  <text x="490" y="226" font-family="monospace" font-size="10" fill="#1e40af" text-anchor="middle">fetchSession()</text>

  <!-- Arrows: Frontend -> Backend -->
  <rect x="160" y="252" width="130" height="18" rx="3" fill="#e0e7ff" />
  <text x="225" y="264" font-family="monospace" font-size="9" fill="#4338ca" text-anchor="middle">sessionStorage JWT</text>

  <!-- HTTP arrows down -->
  <line x1="280" y1="285" x2="280" y2="340" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />
  <line x1="420" y1="285" x2="420" y2="340" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />

  <!-- HTTP labels -->
  <rect x="195" y="300" width="145" height="30" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="267" y="313" font-family="monospace" font-size="9" fill="#166534" text-anchor="middle">POST /sso/decrypt</text>
  <text x="267" y="325" font-family="monospace" font-size="9" fill="#166534" text-anchor="middle">{ key: encrypted }</text>

  <rect x="355" y="300" width="145" height="30" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="427" y="313" font-family="monospace" font-size="9" fill="#166534" text-anchor="middle">GET /sso/session</text>
  <text x="427" y="325" font-family="monospace" font-size="9" fill="#166534" text-anchor="middle">Authorization: Bearer</text>

  <!-- Backend Box -->
  <rect x="140" y="345" width="420" height="140" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
  <text x="350" y="375" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">Backend — FastAPI + Python</text>
  <line x1="180" y1="385" x2="520" y2="385" stroke="#bbf7d0" stroke-width="1" />

  <!-- Backend module boxes -->
  <rect x="160" y="398" width="120" height="38" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="220" y="414" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">crypto.py</text>
  <text x="220" y="428" font-family="system-ui, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">AES + EVP_BytesToKey</text>

  <rect x="290" y="398" width="120" height="38" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="350" y="414" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">auth.py</text>
  <text x="350" y="428" font-family="system-ui, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">JWT + Sessions</text>

  <rect x="420" y="398" width="120" height="38" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="480" y="414" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">main.py</text>
  <text x="480" y="428" font-family="system-ui, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">API Routes</text>

  <!-- Encryption detail -->
  <rect x="160" y="448" width="400" height="26" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
  <text x="360" y="466" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">Salted__ (8 bytes) + salt (8 bytes) + AES-256-CBC ciphertext + PKCS7</text>

  <!-- Step numbers -->
  <circle cx="310" cy="125" r="11" fill="#3b82f6" />
  <text x="310" y="129" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">1</text>

  <circle cx="390" cy="125" r="11" fill="#d97706" />
  <text x="390" y="129" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">2</text>

  <circle cx="280" cy="310" r="11" fill="#16a34a" />
  <text x="280" y="314" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">3</text>

  <circle cx="420" cy="310" r="11" fill="#16a34a" />
  <text x="420" y="314" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">4</text>
</svg>
